name: BRIF-147 lock generation

on:
  push:
    branches:
      - feat/brif-147-telephony-engine

permissions:
  contents: write

jobs:
  lockgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/brif-147-telephony-engine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate package lock with Twilio SDK
        run: npm install twilio@6.1.2 --save-exact --package-lock-only --ignore-scripts
      - name: Commit package files if changed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add Twilio SDK for webhook validation"
          git push origin HEAD:feat/brif-147-telephony-engine
