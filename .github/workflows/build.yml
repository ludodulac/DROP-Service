name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://nczdadkyysrxxcsnsrrn.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fTm-7olaGmH1jqpkE7xXng_eaaiRoKE
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/brif-147-telephony-engine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate Twilio SDK lock
        run: |
          npm install twilio@6.1.2 --save-exact --package-lock-only --ignore-scripts
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "Add Twilio SDK for webhook validation"
            git push origin HEAD:feat/brif-147-telephony-engine
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
